<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - CampusResource</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f2f4f6",
                        "secondary": "#00687a",
                        "background": "#f7f9fb",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#444651",
                        "on-background": "#191c1e",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#b6c4ff",
                        "outline": "#757682",
                        "secondary-fixed": "#acedff",
                        "on-primary-container": "#90a8ff",
                        "on-error": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "surface-container": "#eceef0",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-tertiary-fixed": "#002113",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#dce1ff",
                        "error": "#ba1a1a",
                        "tertiary-container": "#004a31",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary": "#00311f",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed-variant": "#004e5c",
                        "on-tertiary-container": "#27c38a",
                        "on-secondary-container": "#006172",
                        "on-primary-fixed": "#00164e",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#4cd7f6",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "primary": "#00236f",
                        "secondary-container": "#57dffe",
                        "surface-tint": "#4059aa",
                        "primary-container": "#1e3a8a",
                        "on-primary-fixed-variant": "#264191",
                        "inverse-surface": "#2d3133",
                        "surface-bright": "#f7f9fb",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c5c5d3",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#001f26",
                        "error-container": "#ffdad6",
                        "on-surface": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "4px",
                        "sm": "12px",
                        "container-max": "1440px",
                        "2xl": "48px",
                        "lg": "24px",
                        "xl": "32px",
                        "xs": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    },
                    "boxShadow": {
                        "ambient": "0px 4px 20px rgba(30, 58, 138, 0.05)"
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen flex items-center justify-center p-md md:p-lg antialiased font-body-md text-on-surface">
<!-- Notice: Navigation is suppressed as this is a transactional (Login) page -->
<main class="w-full max-w-[440px]">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg md:font-display-lg md:text-display-lg text-primary mb-xs">CampusResource</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Secure access to university facilities.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[1.5rem] shadow-ambient p-lg">
<form action="#" class="flex flex-col gap-md" method="POST">
<!-- Email Input -->
<div class="flex flex-col gap-base">
<label class="font-title-sm text-title-sm text-on-surface" for="email">University Email</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 text-outline material-symbols-outlined pointer-events-none">mail</span>
<input class="w-full pl-[40px] pr-sm py-sm bg-surface-container-lowest border border-[#CBD5E1] rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-[#06B6D4] focus:ring-2 focus:ring-[#06B6D4]/20 transition-all outline-none" id="email" name="email" placeholder="student@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-title-sm text-title-sm text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 text-outline material-symbols-outlined pointer-events-none">lock</span>
<input class="w-full pl-[40px] pr-sm py-sm bg-surface-container-lowest border border-[#CBD5E1] rounded-lg font-body-md text-body-md text-on-surface placeholder:text-outline-variant focus:border-[#06B6D4] focus:ring-2 focus:ring-[#06B6D4]/20 transition-all outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Remember Me -->
<div class="flex items-center gap-xs">
<input class="w-4 h-4 rounded border-[#CBD5E1] text-[#1E3A8A] focus:ring-[#1E3A8A]" id="remember" name="remember" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember">Remember me for 30 days</label>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#1E3A8A] text-on-primary font-title-sm text-title-sm py-sm rounded-lg hover:bg-primary-container/90 transition-colors mt-xs flex justify-center items-center gap-xs" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Demo Hint -->
<div class="mt-lg pt-md border-t border-surface-variant bg-surface-container/50 rounded-lg p-sm">
<div class="flex items-start gap-xs">
<span class="material-symbols-outlined text-outline text-[18px] mt-[2px]">info</span>
<div>
<p class="font-label-caps text-label-caps text-on-surface-variant mb-1">Demo Access</p>
<p class="font-body-sm text-body-sm text-outline">Use <strong>demo@university.edu</strong> and <strong>password</strong> to preview the system.</p>
</div>
</div>
</div>
</div>
<!-- Registration Link -->
<div class="text-center mt-lg">
<p class="font-body-md text-body-md text-on-surface-variant">
                Need an account? <a class="text-primary font-semibold hover:underline" href="#">Register here</a>
</p>
</div>
</main>
</body></html>
