<body class="bg-background min-h-screen flex items-center justify-center p-md">
<!-- Main Container -->
<main class="w-full max-w-[400px]">
<!-- Brand Header -->
<div class="text-center mb-xl">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-primary mb-xs">CampusResource</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to manage your bookings</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-xl p-lg ambient-shadow">
<form action="#" class="space-y-lg" method="POST">
<!-- Email Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-xs" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">mail</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-sm bg-surface-container-lowest border border-[#CBD5E1] rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-[#06B6D4] focus:border-[#06B6D4] transition-colors" id="email" name="email" placeholder="student@university.edu" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-xs">
<label class="block font-label-caps text-label-caps text-on-surface" for="password">Password</label>
<a class="font-body-sm text-body-sm text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline">lock</span>
</div>
<input class="block w-full pl-[40px] pr-sm py-sm bg-surface-container-lowest border border-[#CBD5E1] rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:ring-1 focus:ring-[#06B6D4] focus:border-[#06B6D4] transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center py-sm px-md border border-transparent rounded-lg text-on-primary bg-primary-container font-title-sm text-title-sm hover:opacity-90 transition-opacity active:scale-[0.98]" type="submit">
                    Sign In
                </button>
</form>
<!-- Demo Hint -->
<div class="mt-xl p-md bg-surface-container-low rounded-lg border border-outline-variant">
<div class="flex items-start gap-sm">
<span class="material-symbols-outlined text-secondary mt-[2px] text-[20px]">info</span>
<div>
<h3 class="font-title-sm text-title-sm text-on-surface mb-base text-[14px]">Demo Credentials</h3>
<p class="font-body-sm text-body-sm text-on-surface-variant">Email: demo@university.edu<br/>Password: campus2024</p>
</div>
</div>
</div>
</div>

<p class="font-body-sm text-body-sm text-on-surface-variant">

</p>
