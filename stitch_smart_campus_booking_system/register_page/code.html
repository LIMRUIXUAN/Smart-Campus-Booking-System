<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Register - Smart Campus Booking System</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-low": "#f2f4f6",
                        "secondary": "#00687a",
                        "background": "#f7f9fb",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#444651",
                        "on-background": "#191c1e",
                        "inverse-on-surface": "#eff1f3",
                        "inverse-primary": "#b6c4ff",
                        "outline": "#757682",
                        "secondary-fixed": "#acedff",
                        "on-primary-container": "#90a8ff",
                        "on-error": "#ffffff",
                        "surface-dim": "#d8dadc",
                        "surface-container": "#eceef0",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-fixed-variant": "#005236",
                        "on-tertiary-fixed": "#002113",
                        "tertiary-fixed": "#6ffbbe",
                        "primary-fixed": "#dce1ff",
                        "error": "#ba1a1a",
                        "tertiary-container": "#004a31",
                        "surface-container-highest": "#e0e3e5",
                        "tertiary": "#00311f",
                        "surface-variant": "#e0e3e5",
                        "on-secondary-fixed-variant": "#004e5c",
                        "on-tertiary-container": "#27c38a",
                        "on-secondary-container": "#006172",
                        "on-primary-fixed": "#00164e",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed-dim": "#4cd7f6",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "primary": "#00236f",
                        "secondary-container": "#57dffe",
                        "surface-tint": "#4059aa",
                        "primary-container": "#1e3a8a",
                        "on-primary-fixed-variant": "#264191",
                        "inverse-surface": "#2d3133",
                        "surface-bright": "#f7f9fb",
                        "primary-fixed-dim": "#b6c4ff",
                        "on-primary": "#ffffff",
                        "outline-variant": "#c5c5d3",
                        "surface": "#f7f9fb",
                        "on-secondary-fixed": "#001f26",
                        "error-container": "#ffdad6",
                        "on-surface": "#191c1e"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "24px",
                        "base": "4px",
                        "sm": "12px",
                        "container-max": "1440px",
                        "2xl": "48px",
                        "lg": "24px",
                        "xl": "32px",
                        "xs": "8px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "body-md": ["Inter"],
                        "label-caps": ["Inter"],
                        "display-lg": ["Inter"],
                        "title-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "title-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "display-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-md antialiased">
<!-- Registration Container -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-[1.5rem] p-lg md:p-xl shadow-[0px_4px_20px_rgba(30,58,138,0.05)] border border-outline-variant/30 flex flex-col gap-lg">
<!-- Header -->
<div class="text-center flex flex-col gap-xs items-center">
<div class="w-12 h-12 rounded-lg bg-primary-container/10 flex items-center justify-center text-primary mb-sm">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">account_circle</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Create an Account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Join CampusResource to manage your bookings.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-md">
<!-- Full Name Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="fullName">Full Name</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">person</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-[#06B6D4] focus:ring-1 focus:ring-[#06B6D4] focus:outline-none transition-all placeholder:text-outline/50" id="fullName" placeholder="Jane Doe" type="text"/>
</div>
</div>
<!-- Email Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="email">University Email</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">mail</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-[#06B6D4] focus:ring-1 focus:ring-[#06B6D4] focus:outline-none transition-all placeholder:text-outline/50" id="email" placeholder="student@university.edu" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="password">Password</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full pl-xl pr-xl py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-[#06B6D4] focus:ring-1 focus:ring-[#06B6D4] focus:outline-none transition-all placeholder:text-outline/50" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
<p class="font-body-sm text-body-sm text-outline text-[12px] mt-1">Must be at least 8 characters.</p>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-xs">
<label class="font-label-caps text-label-caps text-on-surface-variant" for="confirmPassword">Confirm Password</label>
<div class="relative">
<span class="absolute left-sm top-1/2 -translate-y-1/2 material-symbols-outlined text-outline">lock</span>
<input class="w-full pl-xl pr-xl py-sm rounded-lg border border-outline-variant bg-surface-container-lowest text-on-surface font-body-md text-body-md focus:border-[#06B6D4] focus:ring-1 focus:ring-[#06B6D4] focus:outline-none transition-all placeholder:text-outline/50" id="confirmPassword" placeholder="••••••••" type="password"/>
<button class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-sm mt-xs">
<input class="mt-1 rounded-[4px] border-outline-variant text-primary focus:ring-primary w-4 h-4 cursor-pointer" id="terms" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="terms">
                    I agree to the <a class="text-primary hover:underline font-semibold" href="#">Terms of Service</a> and <a class="text-primary hover:underline font-semibold" href="#">Privacy Policy</a>.
                </label>
</div>
<!-- Register Button -->
<button class="w-full bg-[#1E3A8A] text-white font-title-sm text-title-sm py-sm rounded-lg hover:bg-[#1E3A8A]/90 focus:ring-2 focus:ring-offset-2 focus:ring-[#1E3A8A] transition-colors mt-xs flex justify-center items-center gap-xs" type="submit">
<span>Register</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="text-center border-t border-outline-variant/30 pt-lg">
<p class="font-body-sm text-body-sm text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-title-sm text-title-sm hover:underline ml-1" href="/login">Log in here</a>
</p>
</div>
</div>
</body></html>
